name: concierge
title: Concierge
repo: https://github.com/dresraz/hermes-concierge
sha: 59cab6430baf248d0b03dc70bd1c7ff2dfca0adb
description: >-
  Install a bot or a skill set like an app: one card, one yes, a receipt, one undo. Say what you
  want in a sentence and Concierge matches it against the live catalog, installs it through
  Hermes's own installer and scan gate, then reads the result back off the disk; /concierge undo
  removes exactly what it added, and /concierge hire turns a sentence into a working profile with
  a role, a set of catalog skills and a SOUL.md. Disclosure: registers one /concierge command and
  one pre_gateway_dispatch hook (reply words in the messaging gateway). Network calls: it fetches
  the plugin catalog index from GitHub and, for the dependency line on the card, one plugin
  manifest at its pinned commit. It reads the active HERMES_HOME (catalog, profiles, plugin and
  skill directories) and writes there: a new profile per hire, skills, a SOUL.md, and the install
  records. Listing, resetting and deleting profiles are limited to profiles Concierge made, and
  the default profile can be reset but never deleted. Installs and removals call the same core
  commands the CLI uses, so Hermes's own scan, consent and pinning still apply. No credentials,
  no telemetry, no self-updater, nothing runs at load time.
maintainer: dresraz
tier: community
category: general
requires_hermes: ">=0.22.7"
